name: diagnose-browser

on:
  workflow_dispatch:
    inputs:
      diagnostic_case:
        description: "Original core assertion to observe without publishing"
        type: choice
        options: [joint, ground, panel]
        default: joint
      shadow_probe:
        description: "Compare native visual shadow flag on/off instead of continuous trace screenshots"
        type: boolean
        default: false
      browser_channel:
        description: "Chromium implementation for an isolated compositor comparison"
        type: choice
        options: [default-shell, chromium]
        default: default-shell
      composited_swiftshader:
        description: "Use SwANGLE as the complete GL driver, not WebGL-only fallback (trusted tests only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  trace-observation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        screenshots: [true, false]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: lshdlut/mujoco-wasm-forge
          ref: 592e1d9ae39587b6697b39387d1a4ec2699bc56a
          path: forge-inputs
          sparse-checkout: deliverables
      - run: mv forge-inputs "$GITHUB_WORKSPACE/../mujoco-wasm-forge"
      - run: npx playwright install --with-deps chromium
      - name: Original core assertion under controlled trace observation
        env:
          PLAY_DEV_SERVER_COI: "1"
          PLAY_PROBE_ROOT: ${{ runner.temp }}/play-browser-probe
          PLAY_PROBE_SCREENSHOTS: ${{ !inputs.shadow_probe && matrix.screenshots }}
          PLAY_PROBE_DISABLE_SHADOWS: ${{ inputs.shadow_probe && !matrix.screenshots }}
          PLAY_PROBE_CHANNEL: ${{ inputs.browser_channel == 'chromium' && 'chromium' || '' }}
          PLAY_PROBE_COMPOSITED_SWIFTSHADER: ${{ inputs.composited_swiftshader }}
          PLAY_PROBE_CASE: ${{ inputs.diagnostic_case }}
        run: node tools/ci_trace_probe.mjs
      - name: Retain diagnostic evidence (not a publication gate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-observation-${{ inputs.shadow_probe && 'shadow' || 'trace' }}-${{ matrix.screenshots }}
          path: ${{ runner.temp }}/play-browser-probe/

# This manual workflow has no Pages artifact, deployment, tag or release step.
# A targeted PASS cannot satisfy release-site's complete core/contract gate.
